<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EdMedia</title>
  <meta name="description" content="Mobile-first offline image editor with reusable templates.">
  <meta name="theme-color" content="#08100c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EdMedia">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- On-screen error console: must stay first so it catches everything after it -->
  <script src="js/debug.js"></script>

  <!-- Set the theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('edmedia-theme');
        var light = p === 'light' || (p !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <div class="app" id="app">
    <main class="app__main" id="view"></main>
    <nav class="bar-bottom" id="nav" aria-label="Main" hidden></nav>
  </div>
  <noscript>EdMedia needs JavaScript to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
